<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-labelledby="titre-ep desc-ep">
  <title id="titre-ep">Les trois épreuves du CRR et leur poids</title>
  <desc id="desc-ep">Vingt-quatre questions réparties en trois épreuves : A, généralités,
  six questions, modules M1 à M5 ; B, radiotéléphonie VHF, huit questions, modules M6 à
  M9 ; C, VHF ASN et SMDSM, dix questions, modules M10 à M13. La moyenne est exigée à
  chacune des trois, prises séparément.</desc>

  <rect x="0" y="0" width="720" height="330" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#0b3550">24 questions · 22 secondes chacune · une seule bonne réponse</text>

  <!-- barre proportionnelle : 6 / 8 / 10 sur 24 -->
  <rect x="24" y="52" width="168" height="76" fill="#4a7fb5"/>
  <rect x="192" y="52" width="224" height="76" fill="#2e5f8f"/>
  <rect x="416" y="52" width="280" height="76" fill="#0b3550"/>

  <text x="108" y="88" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="108" y="112" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6 questions</text>
  <text x="304" y="88" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="304" y="112" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">8 questions</text>
  <text x="556" y="88" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="556" y="112" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">10 questions</text>

  <text x="108" y="152" font-size="12" font-weight="700" fill="#333" text-anchor="middle">Généralités</text>
  <text x="108" y="170" font-size="12" fill="#555" text-anchor="middle">M1 → M5</text>
  <text x="304" y="152" font-size="12" font-weight="700" fill="#333" text-anchor="middle">Radiotéléphonie VHF</text>
  <text x="304" y="170" font-size="12" fill="#555" text-anchor="middle">M6 → M9</text>
  <text x="556" y="152" font-size="12" font-weight="700" fill="#333" text-anchor="middle">VHF ASN et SMDSM</text>
  <text x="556" y="170" font-size="12" fill="#555" text-anchor="middle">M10 → M13</text>

  <!-- la règle -->
  <rect x="24" y="196" width="672" height="52" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="360" y="220" font-size="14" font-weight="700" fill="#c62828" text-anchor="middle">La moyenne est exigée à CHACUNE des trois épreuves, prises séparément.</text>
  <text x="360" y="240" font-size="12" fill="#8b2020" text-anchor="middle">Un bon total ne rattrape pas un effondrement sur l'une d'elles.</text>

  <text x="24" y="278" font-size="12" fill="#555">Regardez la largeur des bandes : l'épreuve C pèse à elle seule plus que A et B réunies.</text>
  <text x="24" y="296" font-size="12" fill="#555">C'est pourquoi M10 à M13 sont les modules les plus denses du programme — le programme</text>
  <text x="24" y="314" font-size="12" fill="#555">n'est pas lissé, il suit le poids réel de l'examen.</text>
</svg>
