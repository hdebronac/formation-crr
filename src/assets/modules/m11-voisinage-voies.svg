<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-labelledby="titre-vois desc-vois">
  <title id="titre-vois">Les deux voies protégées et leurs voisines</title>
  <desc id="desc-vois">Deux groupes. Autour de la voie 16, les voies de garde 75 et 76,
  qui ne sont pas utilisées. Autour de la voie 70, les voies 10 et 11, utilisables mais
  avec précautions.</desc>

  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#333">Deux paires différentes, pour deux voies protégées différentes</text>

  <!-- ===== groupe voie 16 ===== -->
  <text x="24" y="66" font-size="13" font-weight="700" fill="#666">AUTOUR DE LA VOIE 16 — LA PHONIE</text>

  <rect x="24" y="80" width="150" height="86" rx="8" fill="#eceff1" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="99" y="116" font-size="26" font-weight="700" fill="#78909c" text-anchor="middle">75</text>
  <text x="99" y="140" font-size="12" fill="#78909c" text-anchor="middle">voie de garde</text>
  <text x="99" y="156" font-size="12" font-weight="700" fill="#78909c" text-anchor="middle">NON UTILISÉE</text>

  <rect x="186" y="80" width="180" height="86" rx="8" fill="#c62828"/>
  <text x="276" y="116" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">16</text>
  <text x="276" y="138" font-size="12" fill="#ffd7d7" text-anchor="middle">156,800 MHz</text>
  <text x="276" y="155" font-size="11" fill="#ffd7d7" text-anchor="middle">appel · détresse · urgence · sécurité</text>

  <rect x="378" y="80" width="150" height="86" rx="8" fill="#eceff1" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="453" y="116" font-size="26" font-weight="700" fill="#78909c" text-anchor="middle">76</text>
  <text x="453" y="140" font-size="12" fill="#78909c" text-anchor="middle">voie de garde</text>
  <text x="453" y="156" font-size="12" font-weight="700" fill="#78909c" text-anchor="middle">NON UTILISÉE</text>

  <text x="548" y="112" font-size="12" fill="#555">75 et 76 encadrent la 16.</text>
  <text x="548" y="130" font-size="12" fill="#555">On les laisse vides pour</text>
  <text x="548" y="148" font-size="12" fill="#555">qu'aucune émission voisine</text>
  <text x="548" y="166" font-size="12" fill="#555">ne vienne déborder dessus.</text>

  <!-- ===== groupe voie 70 ===== -->
  <text x="24" y="222" font-size="13" font-weight="700" fill="#666">AUTOUR DE LA VOIE 70 — L'APPEL SÉLECTIF NUMÉRIQUE</text>

  <rect x="24" y="236" width="150" height="86" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="99" y="272" font-size="26" font-weight="700" fill="#ef6c00" text-anchor="middle">10</text>
  <text x="99" y="296" font-size="12" fill="#8a4b00" text-anchor="middle">utilisable</text>
  <text x="99" y="312" font-size="12" font-weight="700" fill="#8a4b00" text-anchor="middle">AVEC PRÉCAUTIONS</text>

  <rect x="186" y="236" width="180" height="86" rx="8" fill="#0b3550"/>
  <text x="276" y="272" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">70</text>
  <text x="276" y="294" font-size="12" fill="#cfe2ef" text-anchor="middle">156,525 MHz — ASN seul,</text>
  <text x="276" y="310" font-size="12" fill="#cfe2ef" text-anchor="middle">jamais la voix</text>

  <rect x="378" y="236" width="150" height="86" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="453" y="272" font-size="26" font-weight="700" fill="#ef6c00" text-anchor="middle">11</text>
  <text x="453" y="296" font-size="12" fill="#8a4b00" text-anchor="middle">utilisable</text>
  <text x="453" y="312" font-size="12" font-weight="700" fill="#8a4b00" text-anchor="middle">AVEC PRÉCAUTIONS</text>

  <text x="548" y="268" font-size="12" fill="#555">10 et 11 s'emploient, mais</text>
  <text x="548" y="286" font-size="12" fill="#555">« toutes les précautions »</text>
  <text x="548" y="304" font-size="12" fill="#555">sont exigées pour ne pas</text>
  <text x="548" y="322" font-size="12" fill="#555">brouiller la voie 70.</text>

  <line x1="24" y1="348" x2="696" y2="348" stroke="#ddd" stroke-width="1"/>
  <text x="24" y="372" font-size="13" font-weight="700" fill="#c62828">Les deux nombres qui ENCADRENT sont 75 et 76.</text>
  <text x="24" y="390" font-size="13" font-weight="700" fill="#ef6c00">Les deux qui demandent des PRÉCAUTIONS sont 10 et 11.</text>
</svg>
