<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-labelledby="titre-sd desc-sd">
  <title id="titre-sd">Exploitation simplex et exploitation duplex</title>
  <desc id="desc-sd">En simplex, une seule fréquence sert à l'émission et à la réception :
  chacun parle à son tour, exemple de la voie 6 à 156,300 mégahertz. En duplex, deux
  fréquences distinctes sont utilisées et les deux extrémités émettent en même temps,
  exemple de la voie 79 avec 156,975 et 161,575 mégahertz.</desc>

  <rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

  <!-- ===== simplex ===== -->
  <text x="24" y="34" font-size="16" font-weight="700" fill="#0b3550">SIMPLEX — une seule fréquence, chacun son tour</text>

  <rect x="40" y="56" width="130" height="60" rx="8" fill="#0b3550"/>
  <text x="105" y="82" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">NAVIRE A</text>
  <text x="105" y="102" font-size="11" fill="#cfe2ef" text-anchor="middle">parle, puis écoute</text>

  <rect x="550" y="56" width="130" height="60" rx="8" fill="#0b3550"/>
  <text x="615" y="82" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">NAVIRE B</text>
  <text x="615" y="102" font-size="11" fill="#cfe2ef" text-anchor="middle">écoute, puis parle</text>

  <line x1="180" y1="86" x2="530" y2="86" stroke="#1b6b4a" stroke-width="3"/>
  <polygon points="540,86 524,79 524,93" fill="#1b6b4a"/>
  <polygon points="180,86 196,79 196,93" fill="#1b6b4a"/>
  <rect x="286" y="68" width="138" height="36" rx="6" fill="#ffffff" stroke="#1b6b4a" stroke-width="2"/>
  <text x="355" y="92" font-size="15" font-weight="700" fill="#1b6b4a" text-anchor="middle">156,300 MHz</text>

  <text x="355" y="132" font-size="12" fill="#333" text-anchor="middle">Exemple du manuel : <tspan font-weight="700">voie 6</tspan>, navire – navire.</text>
  <text x="355" y="150" font-size="12" fill="#333" text-anchor="middle">La même fréquence à l'émission comme à la réception :
  il faut <tspan font-weight="700">alterner</tspan>.</text>

  <line x1="24" y1="176" x2="696" y2="176" stroke="#ddd" stroke-width="1"/>

  <!-- ===== duplex ===== -->
  <text x="24" y="208" font-size="16" font-weight="700" fill="#0b3550">DUPLEX — deux fréquences, en même temps</text>

  <rect x="40" y="230" width="130" height="60" rx="8" fill="#0b3550"/>
  <text x="105" y="256" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">NAVIRE</text>
  <text x="105" y="276" font-size="11" fill="#cfe2ef" text-anchor="middle">émet et reçoit</text>

  <rect x="550" y="230" width="130" height="60" rx="8" fill="#1b6b4a"/>
  <text x="615" y="256" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">CROSS</text>
  <text x="615" y="276" font-size="11" fill="#d4eee2" text-anchor="middle">émet et reçoit</text>

  <line x1="180" y1="244" x2="530" y2="244" stroke="#8e44ad" stroke-width="3"/>
  <polygon points="540,244 524,237 524,251" fill="#8e44ad"/>
  

  <line x1="530" y1="278" x2="180" y2="278" stroke="#8e44ad" stroke-width="3"/>
  <polygon points="170,278 186,271 186,285" fill="#8e44ad"/>
  <rect x="256" y="242" width="198" height="42" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <text x="355" y="260" font-size="14" font-weight="700" fill="#8e44ad" text-anchor="middle">156,975 et 161,575 MHz</text>
  <text x="355" y="277" font-size="11" fill="#6c3483" text-anchor="middle">une fréquence par sens</text>

  <text x="355" y="318" font-size="12" fill="#333" text-anchor="middle">Exemple du manuel : <tspan font-weight="700">voie 79</tspan>, diffusion de la météo par les CROSS.</text>
  <text x="355" y="336" font-size="12" fill="#333" text-anchor="middle">Deux fréquences sur la même voie — le poste fait la bascule tout seul.</text>
  <text x="355" y="358" font-size="11" fill="#8a6d00" text-anchor="middle">Laquelle des deux dans quel sens : le manuel n'est pas univoque — voir M12.</text>
</svg>
