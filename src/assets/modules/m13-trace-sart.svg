<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-labelledby="titre-sart desc-sart">
  <title id="titre-sart">Trace d'un répondeur radar SART sur un écran radar</title>
  <desc id="desc-sart">Écran radar ; depuis la position du répondeur, douze traits
  régulièrement espacés s'éloignent du centre vers le bord de l'écran, alignés dans
  l'axe du répondeur.</desc>

  <rect x="0" y="0" width="640" height="420" fill="#0b1a17"/>

  <g fill="none" stroke="#2f7f6f" stroke-width="1.2" opacity="0.9">
    <circle cx="170" cy="340" r="80"/>
    <circle cx="170" cy="340" r="160"/>
    <circle cx="170" cy="340" r="240"/>
    <circle cx="170" cy="340" r="320"/>
  </g>
  <line x1="170" y1="0" x2="170" y2="420" stroke="#2f7f6f" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="340" x2="640" y2="340" stroke="#2f7f6f" stroke-width="0.8" opacity="0.5"/>

  <circle cx="170" cy="340" r="5" fill="#7fe3cc"/>
  <text x="170" y="368" fill="#7fe3cc" font-size="13" text-anchor="middle">mon navire (radar)</text>

  <g stroke="#ffe14d" stroke-width="9" stroke-linecap="round">
    <line x1="233.6" y1="276.4" x2="245.0" y2="265.0"/>
    <line x1="252.0" y1="258.0" x2="263.3" y2="246.7"/>
    <line x1="270.4" y1="239.6" x2="281.7" y2="228.3"/>
    <line x1="288.8" y1="221.2" x2="300.1" y2="209.9"/>
    <line x1="307.2" y1="202.8" x2="318.5" y2="191.5"/>
    <line x1="325.6" y1="184.4" x2="336.9" y2="173.1"/>
    <line x1="343.9" y1="166.1" x2="355.3" y2="154.7"/>
    <line x1="362.3" y1="147.7" x2="373.6" y2="136.4"/>
    <line x1="380.7" y1="129.3" x2="392.0" y2="118.0"/>
    <line x1="399.1" y1="110.9" x2="410.4" y2="99.6"/>
    <line x1="417.5" y1="92.5"  x2="428.8" y2="81.2"/>
    <line x1="435.9" y1="74.1"  x2="447.2" y2="62.8"/>
  </g>

  <circle cx="233.6" cy="276.4" r="5.5" fill="#ffffff"/>
  <path d="M 60 200 L 222 266" stroke="#ffffff" stroke-width="2" fill="none"/>
  <polygon points="228,269 213,268 217,259" fill="#ffffff"/>
  <text x="24" y="176" fill="#ffffff" font-size="19" font-weight="700">SART</text>
  <text x="24" y="196" fill="#cfe9e2" font-size="13">le premier trait marque</text>
  <text x="24" y="214" fill="#cfe9e2" font-size="13">la position du naufragé</text>

  <text x="470" y="230" fill="#ffe14d" font-size="16" font-weight="700">DOUZE TRAITS</text>
  <text x="470" y="252" fill="#cfe9e2" font-size="13">régulièrement espacés,</text>
  <text x="470" y="270" fill="#cfe9e2" font-size="13">alignés dans l'axe du</text>
  <text x="470" y="288" fill="#cfe9e2" font-size="13">répondeur et s'éloignant</text>
  <text x="470" y="306" fill="#cfe9e2" font-size="13">du centre de l'écran.</text>
  <text x="470" y="334" fill="#9fd4c7" font-size="12">Signal de détresse SAR</text>
  <text x="470" y="350" fill="#9fd4c7" font-size="12">reconnu internationalement.</text>
</svg>
