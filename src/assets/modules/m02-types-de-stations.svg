<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
     role="img" aria-labelledby="titre-st desc-st">
  <title id="titre-st">Les quatre définitions de stations du service mobile maritime</title>
  <desc id="desc-st">Une station de navire est une station mobile placée à bord d'un
  navire. Une station côtière est une station terrestre du service mobile maritime. Une
  station portuaire est une station côtière du service des opérations portuaires. Un
  centre de coordination des secours est une station côtière responsable des opérations
  de sauvetage pour une zone déterminée : en France, un CROSS.</desc>

  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#0b3550">Trois des quatre définitions sont des cas particuliers de « station côtière »</text>

  <!-- mer / terre -->
  <rect x="24" y="46" width="316" height="326" rx="10" fill="#eaf3fa"/>
  <rect x="356" y="46" width="340" height="326" rx="10" fill="#f4f1e8"/>
  <text x="182" y="70" font-size="13" font-weight="700" fill="#2e5f8f" text-anchor="middle">EN MER</text>
  <text x="526" y="70" font-size="13" font-weight="700" fill="#8a7a52" text-anchor="middle">À TERRE</text>

  <!-- station de navire -->
  <rect x="44" y="88" width="276" height="92" rx="8" fill="#ffffff" stroke="#2e5f8f" stroke-width="2"/>
  <text x="64" y="116" font-size="15" font-weight="700" fill="#2e5f8f">Station de navire</text>
  <text x="64" y="140" font-size="12" fill="#333">Station <tspan font-weight="700">mobile</tspan> du service mobile</text>
  <text x="64" y="157" font-size="12" fill="#333">maritime placée à bord d'un navire</text>
  <text x="64" y="172" font-size="11" fill="#666">qui n'est pas amarré en permanence</text>

  <text x="182" y="230" font-size="12" fill="#555" text-anchor="middle">Une station du service mobile</text>
  <text x="182" y="248" font-size="12" fill="#555" text-anchor="middle">maritime se compose d'un ou</text>
  <text x="182" y="266" font-size="12" fill="#555" text-anchor="middle">plusieurs émetteurs ou récepteurs :</text>
  <text x="182" y="284" font-size="12" font-weight="700" fill="#555" text-anchor="middle">votre VHF fixe ou portative</text>
  <text x="182" y="302" font-size="12" font-weight="700" fill="#555" text-anchor="middle">en est une.</text>

  <!-- station côtière (englobante) -->
  <rect x="376" y="88" width="300" height="264" rx="8" fill="#ffffff" stroke="#1b6b4a" stroke-width="2"/>
  <text x="396" y="116" font-size="15" font-weight="700" fill="#1b6b4a">Station côtière</text>
  <text x="396" y="138" font-size="12" fill="#333">Station <tspan font-weight="700">terrestre</tspan> du service mobile</text>
  <text x="396" y="155" font-size="12" fill="#333">maritime</text>

  <rect x="396" y="172" width="260" height="76" rx="6" fill="#f2f8f5" stroke="#4c9a78" stroke-width="1.5"/>
  <text x="412" y="196" font-size="13" font-weight="700" fill="#1b6b4a">Station portuaire</text>
  <text x="412" y="216" font-size="12" fill="#333">station côtière du <tspan font-weight="700">service des</tspan></text>
  <text x="412" y="233" font-size="12" fill="#333"><tspan font-weight="700">opérations portuaires</tspan></text>

  <rect x="396" y="258" width="260" height="76" rx="6" fill="#f2f8f5" stroke="#4c9a78" stroke-width="1.5"/>
  <text x="412" y="282" font-size="13" font-weight="700" fill="#1b6b4a">Centre de coordination des secours</text>
  <text x="412" y="302" font-size="12" fill="#333">station côtière <tspan font-weight="700">responsable du</tspan></text>
  <text x="412" y="319" font-size="12" fill="#333"><tspan font-weight="700">sauvetage</tspan> d'une zone — un <tspan font-weight="700">CROSS</tspan></text>

  <text x="24" y="392" font-size="12" fill="#555">Définitions de l'UIT, reprises telles quelles par le manuel. Le mot qui les sépare : <tspan font-weight="700">mobile</tspan> ou <tspan font-weight="700">terrestre</tspan>.</text>
</svg>
